<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="先享后付订单确认演示页，展示订单金额、期数和签约入口。"
    />
    <title>先享后付支付系统 - 订单确认</title>
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body>
    <main class="mobile-page has-bottom-action order-confirm-page">
      <div class="topbar">
        <button
          class="left"
          type="button"
          aria-label="返回上一页"
          onclick="history.back()"
        >
          ‹
        </button>
        运营商金融合约业务订单
      </div>
      <section class="order-head">
        <div class="order-store">● 山东测试门店</div>
        <div class="order-address">山东 济南 历下区 舜耕路1号</div>
        <div class="order-amount card">
          <div style="color: #6b7280; font-size: 22px">先享金额</div>
          <div><strong id="amountText">756.00</strong>元</div>
        </div>
      </section>
      <section class="section">
        <div class="card detail-table">
          <div style="font-size: 24px; font-weight: 700; margin-bottom: 10px">
            ● 订单详情
          </div>
          <div class="row">
            <span class="muted">订单编号</span><strong id="orderNo"></strong>
          </div>
          <div class="row">
            <span class="muted">商品金额</span
            ><strong id="productAmountText"></strong>
          </div>
          <div class="row">
            <span class="muted">平台服务费</span
            ><strong id="serviceFeeText"></strong>
          </div>
          <div class="row">
            <span class="muted">支付方式</span><strong>支付宝先享</strong>
          </div>
          <div class="row">
            <span class="muted">订单期数</span
            ><strong id="installment"></strong>
          </div>
          <div class="row">
            <span class="muted">每期交易情况</span
            ><strong id="stageInfo"></strong>
          </div>
        </div>
        <div
          style="
            margin-top: 16px;
            color: #6b7280;
            font-size: 18px;
            line-height: 1.7;
          "
        >
          温馨提示：<br />
          1. 已知并办理支付宝先享业务，每月及时缴纳还款费用。<br />
          2. 履约后可查询分期计划与订单状态。<br />
          3. 如有问题可咨询在线客服。
        </div>
      </section>
      <div class="bottom-action">
        <div class="agreement-check">
          点击即同意《中国铁塔金融合约业务告知书》等授权协议
        </div>
        <button class="btn btn-blue" id="nextBtn">我已知晓，去签约</button>
      </div>
    </main>
    <script src="../assets/js/app.js"></script>
    <script>
      const order = readOrder();
      updateAmountText("#amountText", toFixedAmount(order.amount || 756));
      updateAmountText("#orderNo", order.orderNo || "");
      updateAmountText(
        "#productAmountText",
        `${toFixedAmount(order.productAmount || 730)}元`,
      );
      updateAmountText(
        "#serviceFeeText",
        `${toFixedAmount(order.serviceFee || 26)}元`,
      );
      updateAmountText("#installment", order.installment || "3个月");
      updateAmountText("#stageInfo", order.stageInfo || "每期252元");
      document
        .getElementById("nextBtn")
        .addEventListener("click", () => go("./agreement.html"));
    </script>
  </body>
</html>
