<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>铁塔换电APP - 收银台</title>
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
  <main class="mobile-page">
    <div class="topbar">
      <button class="left">‹</button>
      购买套餐
    </div>
    <section class="section" style="background: linear-gradient(180deg,#d9fffb 0%,#f6fffe 100%);">
      <div style="font-size:22px;color:#4b5563;line-height:1.45;">
        为您展示【石家庄市】地区套餐，<br>如需查看其他地域套餐，请修改我的用地
      </div>
    </section>
    <section class="section">
      <div class="chip-row">
        <div class="chip">电池电压 全部</div>
        <div class="chip">48V·新国标</div>
        <div class="chip">60V·电轻摩</div>
      </div>
      <div class="chip-row">
        <div class="chip">电池容量 全部</div>
        <div class="chip">20Ah</div>
        <div class="chip">25Ah</div>
        <div class="chip">30Ah</div>
      </div>
      <div class="chip-row">
        <div class="chip">套餐类型 全部</div>
        <div class="chip">不限次套餐</div>
        <div class="chip">次卡套餐</div>
      </div>
    </section>
    <section class="section" id="pkgList">
      <div class="pkg featured">
        <div class="battery-icon">🔋</div>
        <div>
          <div class="pkg-title">先享后付特价199元30天</div>
          <div class="pkg-price">¥199 <span class="old">¥300</span></div>
          <div class="pkg-tags">
            <span>不限次数</span>
            <span>租金可退</span>
            <span>套餐说明</span>
          </div>
        </div>
        <span class="badge" id="signedTag" style="display:none;">已签约</span>
      </div>
      <div class="pkg card">
        <div class="battery-icon">🔋</div>
        <div>
          <div class="pkg-title">石家庄60天换电套餐（超值推荐）</div>
          <div class="pkg-price">¥449 <span class="old">¥600</span></div>
        </div>
      </div>
      <div class="pkg card">
        <div class="battery-icon">🔋</div>
        <div>
          <div class="pkg-title">石家庄30天换电套餐</div>
          <div class="pkg-price">¥229 <span class="old">¥300</span></div>
        </div>
      </div>
    </section>
    <div class="bottom-action">
      <label class="agreement-check">
        <input type="checkbox" id="agreeCheck">
        请阅读并同意铁塔换电 <a href="./pages/agreement.html?preview=1">《套餐协议》</a>
      </label>
      <button class="btn btn-primary" id="payBtn" disabled>立即支付</button>
    </div>
  </main>
  <script src="./assets/js/app.js"></script>
  <script>
    const query = new URLSearchParams(window.location.search);
    if (query.get("success") === "1") {
      document.getElementById("signedTag").style.display = "inline-block";
      showToast("签约并支付完成，欢迎使用先享后付");
    }

    document.getElementById("agreeCheck").addEventListener("change", (e) => {
      document.getElementById("payBtn").disabled = !e.target.checked;
    });

    document.getElementById("payBtn").addEventListener("click", () => {
      saveOrder({
        packageName: "先享后付特价199元30天",
        amount: 199,
        originalAmount: 300,
        period: "30天",
        city: "石家庄市",
        orderNo: `2026${Date.now()}`.slice(0, 16),
        installment: "36月",
        stageInfo: "第1期24.15元，第2-36期3.91元"
      });
      go("./pages/order-confirm.html");
    });
  </script>
</body>
</html>
