<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>支付宝 - 输入支付密码</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="mobile-page alipay">
    <div class="password-mask"></div>
    <section class="password-panel">
      <div class="pwd-title">请输入支付密码</div>
      <div class="pwd-dots" id="dots">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <p class="center" style="color:#0ea5e9;font-size:24px;">安全支付环境，请放心使用！</p>
      <div class="keypad" id="keypad">
        <button class="key" data-v="1">1</button>
        <button class="key" data-v="2">2</button>
        <button class="key" data-v="3">3</button>
        <button class="key" data-v="4">4</button>
        <button class="key" data-v="5">5</button>
        <button class="key" data-v="6">6</button>
        <button class="key" data-v="7">7</button>
        <button class="key" data-v="8">8</button>
        <button class="key" data-v="9">9</button>
        <button class="key gray"></button>
        <button class="key" data-v="0">0</button>
        <button class="key gray" data-v="del">⌫</button>
      </div>
    </section>
  </main>
  <script src="./app.js"></script>
  <script>
    const dots = Array.from(document.querySelectorAll("#dots span"));
    let pwd = "";
    function render() {
      dots.forEach((dot, i) => {
        dot.textContent = i < pwd.length ? "●" : "";
      });
      if (pwd.length === 6) {
        setTimeout(() => go("./sign-success.html"), 500);
      }
    }
    document.getElementById("keypad").addEventListener("click", (e) => {
      const key = e.target.closest("button");
      if (!key) {
        return;
      }
      const v = key.dataset.v;
      if (!v) {
        return;
      }
      if (v === "del") {
        pwd = pwd.slice(0, -1);
      } else if (pwd.length < 6) {
        pwd += v;
      }
      render();
    });
  </script>
</body>
</html>
